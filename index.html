<body class="bg-obsidian text-slate-100 min-h-screen pb-12 antialiased">
  <div id="root"></div>

  <!-- Inline Service Worker for PWA Offline Caching -->
  <script>
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'whalewatch-pwa-v1';
        self.addEventListener('install', (e) => {
          self.skipWaiting();
        });
        self.addEventListener('activate', (e) => {
          e.waitUntil(clients.claim());
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(
            fetch(e.request).catch(() => caches.match(e.request))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }
  </script>

  <!-- Main React PWA Application -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const WATCHLIST = [
      { symbol: 'BTCUSDT', base: 'BTC', name: 'Bitcoin', icon: '₿' },
      { symbol: 'ETHUSDT', base: 'ETH', name: 'Ethereum', icon: 'Ξ' },
      { symbol: 'SOLUSDT', base: 'SOL', name: 'Solana', icon: '◎' },
      { symbol: 'XRPUSDT', base: 'XRP', name: 'Ripple', icon: '✕' },
      { symbol: 'DOGEUSDT', base: 'DOGE', name: 'Dogecoin', icon: 'Ð' },
      { symbol: 'BNBUSDT', base: 'BNB', name: 'BNB Chain', icon: '🔶' },
      { symbol: 'SUIUSDT', base: 'SUI', name: 'Sui Network', icon: '💧' },
      { symbol: 'PEPEUSDT', base: 'PEPE', name: 'Pepe', icon: '🐸' }
    ];

    function App() {
      const [selectedSymbol, setSelectedSymbol] = useState('BTCUSDT');
      const [prices, setPrices] = useState({
        BTCUSDT: { price: 88450.0, change24h: 1.65, high: 89800.0, low: 86500.0, volume: 4.82, prevPrice: 88450.0 },
        ETHUSDT: { price: 3420.5, change24h: 2.85, high: 3490.0, low: 3310.0, volume: 2.15, prevPrice: 3420.5 },
        SOLUSDT: { price: 194.2, change24h: -0.45, high: 199.5, low: 188.2, volume: 1.45, prevPrice: 194.2 },
        XRPUSDT: { price: 2.45, change24h: 4.20, high: 2.58, low: 2.31, volume: 0.95, prevPrice: 2.45 },
        DOGEUSDT: { price: 0.285, change24h: -1.25, high: 0.305, low: 0.272, volume: 0.85, prevPrice: 0.285 },
        BNBUSDT: { price: 645.0, change24h: 0.85, high: 658.0, low: 638.0, volume: 0.45, prevPrice: 645.0 },
        SUIUSDT: { price: 3.42, change24h: 6.80, high: 3.65, low: 3.12, volume: 0.62, prevPrice: 3.42 },
        PEPEUSDT: { price: 0.0000185, change24h: 8.45, high: 0.0000198, low: 0.0000168, volume: 1.15, prevPrice: 0.0000185 }
      });

      const [macro, setMacro] = useState({
        totalMarketCap: 3.25,
        totalMarketCapChange24h: 1.85,
        btcDominance: 57.8,
        ethDominance: 12.8,
        usdtDominance: 4.95,
        total2Cap: 1.37,
        total3Cap: 0.95,
        lastSyncTime: new Date().toLocaleTimeString()
      });

      const [wsConnected, setWsConnected] = useState(false);
      const [installPrompt, setInstallPrompt] = useState(null);
      const [flashMap, setFlashMap] = useState({});
      const [riskModalOpen, setRiskModalOpen] = useState(false);

      useEffect(() => {
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          setInstallPrompt(e);
        });
      }, []);

      const handleInstallApp = async () => {
        if (!installPrompt) {
          alert("To install on iOS/Android Chrome: Tap browser menu (⋮ or Share) and select 'Add to Home screen'");
          return;
        }
        installPrompt.prompt();
        const { outcome } = await installPrompt.userChoice;
        if (outcome === 'accepted') {
          setInstallPrompt(null);
        }
      };

      // Binance Public WebSocket Stream
      useEffect(() => {
        let ws;
        let reconnectTimeout;

        const connectBinanceWS = () => {
          const streams = WATCHLIST.map(w => `${w.symbol.toLowerCase()}@ticker`).join('/');
          const wsUrl = `wss://fstream.binance.com/ws/${streams}`;

          ws = new WebSocket(wsUrl);

          ws.onopen = () => {
            setWsConnected(true);
          };

          ws.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              const symbol = data.s;
              const newPrice = parseFloat(data.c);
              const change24h = parseFloat(data.P);
              const high24h = parseFloat(data.h);
              const low24h = parseFloat(data.l);
              const volumeQuote = parseFloat(data.q) / 1_000_000_000.0;

              if (symbol && !isNaN(newPrice)) {
                setPrices(prev => {
                  const current = prev[symbol] || { price: newPrice, prevPrice: newPrice };
                  const isUp = newPrice >= current.price;
                  
                  setFlashMap(f => ({ ...f, [symbol]: isUp ? 'green' : 'red' }));
                  setTimeout(() => {
                    setFlashMap(f => ({ ...f, [symbol]: null }));
                  }, 600);

                  return {
                    ...prev,
                    [symbol]: {
                      price: newPrice,
                      prevPrice: current.price,
                      change24h: change24h,
                      high: high24h,
                      low: low24h,
                      volume: volumeQuote > 0 ? volumeQuote : (current.volume || 1.0)
                    }
                  };
                });
              }
            } catch (err) {}
          };

          ws.onclose = () => {
            setWsConnected(false);
            reconnectTimeout = setTimeout(connectBinanceWS, 3000);
          };

          ws.onerror = () => {
            setWsConnected(false);
            ws.close();
          };
        };

        connectBinanceWS();

        return () => {
          if (ws) ws.close();
          if (reconnectTimeout) clearTimeout(reconnectTimeout);
        };
      }, []);

      // CoinGecko Global Data Polling
      useEffect(() => {
        const fetchGlobalData = async () => {
          try {
            const res = await fetch('https://api.coingecko.com/api/v3/global', {
              headers: { 'Accept': 'application/json' }
            });
            if (res.ok) {
              const json = await res.json();
              const data = json.data;
              const totalCap = data.total_market_cap.usd / 1_000_000_000_000.0;
              const change = data.market_cap_change_percentage_24h_usd || 1.5;
              const btcD = data.market_cap_percentage.btc || 57.8;
              const ethD = data.market_cap_percentage.eth || 12.8;
              const usdtD = data.market_cap_percentage.usdt || 4.9;

              const total2 = totalCap * (1 - (btcD / 100));
              const total3 = totalCap * (1 - ((btcD + ethD) / 100));

              setMacro({
                totalMarketCap: totalCap,
                totalMarketCapChange24h: change,
                btcDominance: btcD,
                ethDominance: ethD,
                usdtDominance: usdtD,
                total2Cap: total2,
                total3Cap: total3,
                lastSyncTime: new Date().toLocaleTimeString()
              });
            }
          } catch (e) {}
        };

        fetchGlobalData();
        const interval = setInterval(fetchGlobalData, 12000);
        return () => clearInterval(interval);
      }, []);

      // Institutional Decision Engine
      const calculateDecision = () => {
        const btcD = macro.btcDominance;
        const totalCapChange = macro.totalMarketCapChange24h;
        const usdtD = macro.usdtDominance;

        if (usdtD > 5.6 || totalCapChange < -2.8) {
          return {
            badge: "Best Move: Stay in USDT Cash ⚠️",
            badgeColor: "bg-goldWarning/20 border-goldWarning text-goldWarning",
            title: "⚠️ SMART MONEY EXIT TO CASH",
            hindi: "व्हेल्स और स्मार्ट मनी प्रॉफिट बुक करके कैश (USDT) में बैठ रही हैं। मार्केट में लिक्विडिटी कम हो रही है, नए लॉन्ग से बचें।",
            english: "USDT Dominance surging + Total liquidity drain. Preservation mode.",
            stage: "USDT_CASH",
            signal: "STRONG EXIT / CASH"
          };
        } else if (btcD < 56.5 && totalCapChange >= 0.5) {
          return {
            badge: "Best Move: Long Alts 🚀",
            badgeColor: "bg-emeraldBull/20 border-emeraldBull text-emeraldBull glow-emerald",
            title: "🚀 ALTCOIN RALLY ALERT",
            hindi: "पैसा Bitcoin (BTC) से निकलकर Altcoins में तेज़ी से रोटेट हो रहा है। Top L1s (ETH/SOL) और हाई-बीटा Alts में Long का सबसे बड़ा मौका है।",
            english: "BTC Dominance dropping while Total Cap expands. Broad Altcoin expansion phase.",
            stage: "TOP_ALTS",
            signal: "STRONG LONG (ALTS)"
          };
        } else if (btcD >= 57.5 && totalCapChange < 0) {
          return {
            badge: "Best Move: Short Alts / Cash 🩸",
            badgeColor: "bg-roseBear/20 border-roseBear text-roseBear glow-rose",
            title: "🩸 ALTCOIN DUMP ALERT",
            hindi: "पूरे बाजार से लिक्विडिटी बाहर निकल रही है और Alts सबसे ज्यादा ब्लीड कर रहे हैं। Alts में बॉटम-फिशिंग न करें; शॉर्ट या कैश में रहें।",
            english: "Total Market Cap draining with rising BTC.D. Alts suffering heavy drawdown.",
            stage: "USDT_CASH",
            signal: "STRONG SHORT (ALTS)"
          };
        } else {
          return {
            badge: "Best Move: Long BTC Only ⚡",
            badgeColor: "bg-neonCyan/20 border-neonCyan text-neonCyan glow-cyan",
            title: "⚡ BTC ONLY RUN ALERT",
            hindi: "मार्केट की सारी नई लिक्विडिटी सिर्फ Bitcoin में खींच रही है। Alts स्थिर या लैग कर सकते हैं; केवल BTC में मोमेंटम ट्रेड करें।",
            english: "Institutional liquidity concentrating into Bitcoin. Altcoins underperforming BTC.",
            stage: "BTC_RUN",
            signal: "STRONG LONG (BTC ONLY)"
          };
        }
      };

      const decision = calculateDecision();
      const currentSelected = prices[selectedSymbol] || prices['BTCUSDT'];
      const selectedMeta = WATCHLIST.find(w => w.symbol === selectedSymbol) || WATCHLIST[0];

      return (
        <div className="max-w-md mx-auto px-3.5 pt-3">
          {/* Header Terminal Bar */}
          <header className="flex items-center justify-between py-2 border-b border-surfaceBorder mb-3">
            <div className="flex items-center space-x-2">
              <div className="w-8 h-8 rounded-lg bg-whalePurple/20 border border-whalePurple flex items-center justify-center font-bold text-neonCyan text-base">
                🐋
              </div>
              <div>
                <h1 className="text-sm font-black tracking-wider text-slate-100 font-mono flex items-center gap-1.5">
                  WHALEWATCH PRO <span className="text-[10px] text-neonCyan font-bold bg-neonCyan/10 px-1 rounded">PWA</span>
                </h1>
                <p className="text-[10px] text-slate-400 font-mono">Binance WebSocket • CoinGecko Macro</p>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <div className="flex items-center space-x-1.5 bg-surfaceElevated px-2 py-1 rounded-full border border-surfaceBorder">
                <span className={`w-2 h-2 rounded-full ${wsConnected ? 'bg-emeraldBull animate-ping-slow' : 'bg-roseBear'}`}></span>
                <span className="text-[10px] font-mono font-bold text-slate-300">
                  {wsConnected ? 'WS LIVE' : 'CONNECTING'}
                </span>
              </div>

              {installPrompt && (
                <button
                  onClick={handleInstallApp}
                  className="bg-neonCyan text-obsidian text-[10px] font-black px-2.5 py-1 rounded-md shadow flex items-center gap-1 hover:bg-cyan-300 transition"
                >
                  📲 INSTALL
                </button>
              )}
            </div>
          </header>

          {/* Real-time Ticker Carousel */}
          <div className="flex space-x-2 overflow-x-auto custom-scrollbar pb-2 mb-3">
            {WATCHLIST.map(coin => {
              const p = prices[coin.symbol] || { price: 0, change24h: 0 };
              const isSelected = selectedSymbol === coin.symbol;
              const flash = flashMap[coin.symbol];

              return (
                <div
                  key={coin.symbol}
                  onClick={() => setSelectedSymbol(coin.symbol)}
                  className={`flex-shrink-0 cursor-pointer rounded-xl p-2.5 border transition-all ${
                    isSelected
                      ? 'bg-surfaceElevated border-neonCyan glow-cyan'
                      : 'bg-surfaceDark border-surfaceBorder hover:border-slate-500'
                  } ${flash === 'green' ? 'price-flash-green' : flash === 'red' ? 'price-flash-red' : ''}`}
                  style={{ width: '120px' }}
                >
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-xs font-bold text-slate-200 font-mono flex items-center gap-1">
                      <span>{coin.icon}</span> {coin.base}
                    </span>
                    <span className={`text-[10px] font-bold font-mono ${p.change24h >= 0 ? 'text-emeraldBull' : 'text-roseBear'}`}>
                      {p.change24h >= 0 ? '+' : ''}{p.change24h.toFixed(1)}%
                    </span>
                  </div>
                  <div className="text-xs font-black text-slate-100 font-mono">
                    ${p.price < 0.01 ? p.price.toFixed(7) : p.price < 10 ? p.price.toFixed(3) : p.price.toLocaleString(undefined, { maximumFractionDigits: 2 })}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Macro & Liquidity Flow Radar Card */}
          <section className="bg-surfaceDark border border-surfaceBorder rounded-2xl p-3.5 mb-3.5 shadow-lg">
            <div className="flex items-center justify-between mb-2.5">
              <div className="flex items-center space-x-2">
                <span className="text-neonCyan text-base">🌊</span>
                <div>
                  <h2 className="text-xs font-black text-slate-100 font-mono tracking-wide">
                    MACRO LIQUIDITY RADAR
                  </h2>
                  <p className="text-[9.5px] text-slate-400 font-mono">Global Market Cap & Dominance Flow</p>
                </div>
              </div>
              <span className="text-[9px] font-mono text-neonCyan bg-neonCyan/10 border border-neonCyan/30 px-2 py-0.5 rounded">
                SYNC: {macro.lastSyncTime}
              </span>
            </div>

            {/* 4 Macro Stat Cards */}
            <div className="grid grid-cols-2 gap-2 mb-3">
              <div className="bg-surfaceElevated border border-surfaceBorder rounded-xl p-2.5">
                <div className="text-[9.5px] font-bold text-slate-400 font-mono">TOTAL CAP</div>
                <div className="text-sm font-black text-slate-100 font-mono">
                  ${macro.totalMarketCap.toFixed(2)}T
                  <span className={`text-[10px] ml-1.5 ${macro.totalMarketCapChange24h >= 0 ? 'text-emeraldBull' : 'text-roseBear'}`}>
                    {macro.totalMarketCapChange24h >= 0 ? '+' : ''}{macro.totalMarketCapChange24h.toFixed(2)}%
                  </span>
                </div>
              </div>

              <div className="bg-surfaceElevated border border-surfaceBorder rounded-xl p-2.5">
                <div className="text-[9.5px] font-bold text-slate-400 font-mono">ALTS CAP (TOTAL 2)</div>
                <div className="text-sm font-black text-whalePurple font-mono">
                  ${macro.total2Cap.toFixed(2)}T
                  <span className="text-[9px] text-slate-400 ml-1 font-normal">T3: ${macro.total3Cap.toFixed(2)}T</span>
                </div>
              </div>

              <div className="bg-surfaceElevated border border-surfaceBorder rounded-xl p-2.5">
                <div className="text-[9.5px] font-bold text-slate-400 font-mono">BTC DOMINANCE (BTC.D)</div>
                <div className="text-sm font-black text-neonCyan font-mono">
                  {macro.btcDominance.toFixed(1)}% <span className="text-xs">↗</span>
                </div>
              </div>

              <div className="bg-surfaceElevated border border-surfaceBorder rounded-xl p-2.5">
                <div className="text-[9.5px] font-bold text-slate-400 font-mono">USDT DOMINANCE (USDT.D)</div>
                <div className="text-sm font-black text-goldWarning font-mono">
                  {macro.usdtDominance.toFixed(1)}% 🛡️
                </div>
              </div>
            </div>

            {/* Liquidity Cycle Rotation Pipeline */}
            <div className="mb-3">
              <div className="text-[10px] font-bold text-slate-400 font-mono mb-1.5">
                ⚡ LIQUIDITY CYCLE ROTATION STAGE:
              </div>
              <div className="grid grid-cols-4 gap-1 bg-surfaceElevated p-1.5 rounded-xl border border-surfaceBorder text-center">
                {[
                  { key: 'USDT_CASH', icon: '💵', label: 'USDT Cash' },
                  { key: 'BTC_RUN', icon: '⚡', label: 'BTC Run' },
                  { key: 'TOP_ALTS', icon: '🚀', label: 'Top Alts' },
                  { key: 'LOW_CAPS', icon: '💎', label: 'Low Caps' }
                ].map(stage => {
                  const isActive = decision.stage === stage.key;
                  return (
                    <div
                      key={stage.key}
                      className={`p-1.5 rounded-lg border transition ${
                        isActive
                          ? 'bg-neonCyan/20 border-neonCyan text-neonCyan font-bold'
                          : 'bg-obsidian/40 border-transparent text-slate-400'
                      }`}
                    >
                      <div className="text-xs">{stage.icon}</div>
                      <div className="text-[9px] font-mono truncate">{stage.label}</div>
                      {isActive && <div className="text-[7.5px] text-emeraldBull font-black">ACTIVE</div>}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* AI Decision Box */}
            <div className="bg-gradient-to-br from-surfaceElevated to-surfaceDark border border-surfaceBorder rounded-xl p-3">
              <div className="flex items-center justify-between mb-2">
                <div className={`text-xs font-black px-2.5 py-1 rounded-md border font-mono ${decision.badgeColor}`}>
                  {decision.badge}
                </div>
                <span className="text-[9.5px] text-slate-400 font-mono">
                  Signal: <strong className="text-slate-200">{decision.signal}</strong>
                </span>
              </div>
              <h3 className="text-xs font-bold text-slate-100 font-mono mb-1">{decision.title}</h3>
              <p className="text-[11.5px] text-slate-300 leading-relaxed mb-1.5">{decision.hindi}</p>
              <p className="text-[10px] text-slate-400 font-mono">Flow: {decision.english}</p>
            </div>
          </section>

          {/* Active Asset Intelligence Terminal */}
          <section className="bg-surfaceDark border border-surfaceBorder rounded-2xl p-3.5 mb-3.5 shadow-lg">
            <div className="flex items-center justify-between border-b border-surfaceBorder pb-2.5 mb-3">
              <div className="flex items-center space-x-2">
                <span className="text-xl">{selectedMeta.icon}</span>
                <div>
                  <h3 className="text-sm font-black text-slate-100 font-mono">
                    {selectedMeta.name} ({selectedMeta.base}/USDT)
                  </h3>
                  <p className="text-[10px] text-slate-400 font-mono">Binance Perpetual Futures (Live Order Flow)</p>
                </div>
              </div>
              <div className="text-right">
                <div className="text-sm font-black text-neonCyan font-mono">
                  ${currentSelected.price < 0.01 ? currentSelected.price.toFixed(7) : currentSelected.price < 10 ? currentSelected.price.toFixed(3) : currentSelected.price.toLocaleString(undefined, { maximumFractionDigits: 2 })}
                </div>
                <div className={`text-[10px] font-bold font-mono ${currentSelected.change24h >= 0 ? 'text-emeraldBull' : 'text-roseBear'}`}>
                  {currentSelected.change24h >= 0 ? '+' : ''}{currentSelected.change24h.toFixed(2)}% (24h)
                </div>
              </div>
            </div>

            {/* 24h High/Low & Volume */}
            <div className="grid grid-cols-3 gap-2 mb-3 text-center">
              <div className="bg-surfaceElevated p-2 rounded-xl border border-surfaceBorder">
                <div className="text-[9px] text-slate-400 font-mono">24H HIGH</div>
                <div className="text-xs font-bold text-slate-200 font-mono">
                  ${currentSelected.high.toLocaleString()}
                </div>
              </div>
              <div className="bg-surfaceElevated p-2 rounded-xl border border-surfaceBorder">
                <div className="text-[9px] text-slate-400 font-mono">24H LOW</div>
                <div className="text-xs font-bold text-slate-200 font-mono">
                  ${currentSelected.low.toLocaleString()}
                </div>
              </div>
              <div className="bg-surfaceElevated p-2 rounded-xl border border-surfaceBorder">
                <div className="text-[9px] text-slate-400 font-mono">24H VOL (USDT)</div>
                <div className="text-xs font-bold text-whalePurple font-mono">
                  ${currentSelected.volume.toFixed(2)}B
                </div>
              </div>
            </div>

            {/* Precision Entry / TP / SL Signal Box */}
            <div className="bg-surfaceElevated border border-surfaceBorder rounded-xl p-3">
              <div className="text-[10px] font-bold text-neonCyan font-mono uppercase tracking-wider mb-2">
                🎯 Institutional Trade Setup
              </div>
              <div className="grid grid-cols-3 gap-2 text-center text-xs font-mono">
                <div className="bg-obsidian p-2 rounded-lg border border-slate-700">
                  <div className="text-[9px] text-slate-400">ENTRY ZONE</div>
                  <div className="font-bold text-slate-200">${(currentSelected.price * 0.996).toFixed(2)}</div>
                </div>
                <div className="bg-obsidian p-2 rounded-lg border border-emeraldBull/40">
                  <div className="text-[9px] text-emeraldBull">TAKE PROFIT</div>
                  <div className="font-bold text-emeraldBull">${(currentSelected.price * 1.028).toFixed(2)}</div>
                </div>
                <div className="bg-obsidian p-2 rounded-lg border border-roseBear/40">
                  <div className="text-[9px] text-roseBear">STOP LOSS</div>
                  <div className="font-bold text-roseBear">${(currentSelected.price * 0.988).toFixed(2)}</div>
                </div>
              </div>
            </div>

            {/* Risk Calculator Action Button */}
            <button
              onClick={() => setRiskModalOpen(true)}
              className="w-full mt-3 bg-surfaceElevated hover:bg-slate-700 border border-slate-600 text-slate-200 py-2 rounded-xl text-xs font-mono font-bold flex items-center justify-center gap-1.5 transition"
            >
              📐 Open Position Size & Leverage Calculator
            </button>
          </section>

          {/* Risk Calculator Modal */}
          {riskModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-surfaceDark border border-neonCyan/40 rounded-2xl max-w-sm w-full p-4 shadow-2xl">
                <div className="flex items-center justify-between pb-2 border-b border-surfaceBorder mb-3">
                  <h3 className="text-sm font-bold text-slate-100 font-mono">📐 Position & Leverage Calculator</h3>
                  <button onClick={() => setRiskModalOpen(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <div className="space-y-3 font-mono text-xs">
                  <div>
                    <label className="text-slate-400 text-[10px]">Account Balance (USDT)</label>
                    <input type="number" defaultValue="1000" className="w-full bg-surfaceElevated border border-surfaceBorder rounded-lg p-2 text-white font-bold mt-1" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-400 text-[10px]">Risk % (Max 2%)</label>
                      <input type="number" defaultValue="1.5" className="w-full bg-surfaceElevated border border-surfaceBorder rounded-lg p-2 text-white font-bold mt-1" />
                    </div>
                    <div>
                      <label className="text-slate-400 text-[10px]">Leverage</label>
                      <input type="number" defaultValue="10" className="w-full bg-surfaceElevated border border-surfaceBorder rounded-lg p-2 text-white font-bold mt-1" />
                    </div>
                  </div>

                  <div className="bg-surfaceElevated p-3 rounded-xl border border-surfaceBorder text-[11px] space-y-1">
                    <div className="flex justify-between text-slate-300">
                      <span>Max Dollar Risk:</span>
                      <strong className="text-roseBear">$15.00 USDT</strong>
                    </div>
                    <div className="flex justify-between text-slate-300">
                      <span>Recommended Margin:</span>
                      <strong className="text-neonCyan">$125.00 USDT (10x)</strong>
                    </div>
                  </div>

                  <button
                    onClick={() => setRiskModalOpen(false)}
                    className="w-full bg-neonCyan text-obsidian font-bold py-2 rounded-xl mt-2 font-mono"
                  >
                    Apply Parameters
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer Terminal Credits */}
          <footer className="text-center pt-2 pb-6 border-t border-surfaceBorder text-slate-500 text-[10px] font-mono">
            WhaleWatch Pro Mobile PWA • Real-time WebSocket Protocol &copy; 2026
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
